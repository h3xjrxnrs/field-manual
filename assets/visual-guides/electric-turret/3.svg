<svg xmlns="http://www.w3.org/2000/svg" width="800" height="352" viewBox="0 0 800 352" role="img"><title>Install one auto turret — Load the in-game turret</title><desc>Place a compatible in-game weapon and matching ammunition in the turret inventory.</desc><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#323a34" stroke-width=".7"/></pattern></defs><rect width="800" height="352" fill="#141916"/><rect width="800" height="352" fill="url(#grid)" opacity=".6"/><rect x="0" y="0" width="800" height="58" fill="#222824"/><text x="24" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#a9b8a2" text-anchor="start">ELECTRICITY / STEP 03</text><text x="24" y="46" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#f2f2e9" text-anchor="start">Load the in-game turret</text><text x="776" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#9da99b" text-anchor="end">FIELD MANUAL / L.</text><rect x="25" y="85" width="367" height="208" rx="7" fill="#202423" stroke="#444b43" stroke-width="1.7"/><g transform="translate(208.5 157) scale(0.83)"><path d="M0 10 L-27 34 M0 10 L27 34 M0 10 V34" fill="none" stroke="#a0a498" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="-25" y="-12" width="50" height="25" rx="4" fill="#444b45" stroke="#a1a99c" stroke-width="1.7"/><circle cx="0" cy="0" r="8" fill="#242c29" stroke="#829184" stroke-width="1.6"/><path d="M10 -8 H37 M10 0 H37" fill="none" stroke="#9da39a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="208.5" y="220" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#e8e8df" text-anchor="middle">Auto Turret</text><text x="208.5" y="266" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#b3c3ad" text-anchor="middle">Inventory</text><rect x="408" y="85" width="367" height="208" rx="7" fill="#202423" stroke="#444