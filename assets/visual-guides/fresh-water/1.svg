<svg xmlns="http://www.w3.org/2000/svg" width="800" height="352" viewBox="0 0 800 352" role="img"><title>River irrigation — Find a freshwater source</title><desc>Place the pump in a valid river or lake position. Check that the water is fresh, not saltwater.</desc><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#323a34" stroke-width=".7"/></pattern></defs><rect width="800" height="352" fill="#141916"/><rect width="800" height="352" fill="url(#grid)" opacity=".6"/><rect x="0" y="0" width="800" height="58" fill="#222824"/><text x="24" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#a9b8a2" text-anchor="start">FARMING / STEP 01</text><text x="24" y="46" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#f2f2e9" text-anchor="start">Find a freshwater source</text><text x="776" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#9da99b" text-anchor="end">FIELD MANUAL / L.</text><rect x="25" y="85" width="367" height="208" rx="7" fill="#202423" stroke="#444b43" stroke-width="1.7"/><g transform="translate(208.5 157) scale(0.83)"><path d="M-43 -9 Q-30 -20 -15 -9 T13 -9 T43 -9 M-43 6 Q-30 -5 -15 6 T13 6 T43 6 M-43 21 Q-30 10 -15 21 T13 21 T43 21" fill="none" stroke="#79b6da" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="208.5" y="220" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#e8e8df" text-anchor="middle">River</text><text x="208.5" y="266" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#b3c3ad" text-anchor="middle">Fresh water</text><rect x="408" y="85" width="367" height="208" rx="7" fill="#202423" stroke="#444b43" stroke-width="1.7"/><g transform="translate(591.5 157) scale(0.83)"><rect x="-40" y="-22" width="80" height="44" rx="5" fill="#35434a" stroke="#91a8b2" stroke-width="1.7"/><circle cx="-4" cy="0" r="17" fill="#263237" stroke="#94b8c6"