<svg xmlns="http://www.w3.org/2000/svg" width="800" height="352" viewBox="0 0 800 352" role="img"><title>Starter hemp farm — Harvest and reserve the next batch</title><desc>At the appropriate stage, clone enough plants for the next planting and harvest the remaining ripe crop. Store the two outputs separately.</desc><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#323a34" stroke-width=".7"/></pattern></defs><rect width="800" height="352" fill="#141916"/><rect width="800" height="352" fill="url(#grid)" opacity=".6"/><rect x="0" y="0" width="800" height="58" fill="#222824"/><text x="24" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#a9b8a2" text-anchor="start">FARMING / STEP 06</text><text x="24" y="46" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#f2f2e9" text-anchor="start">Harvest and reserve the next batch</text><text x="776" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#9da99b" text-anchor="end">FIELD MANUAL / L.</text><rect x="30" y="85" width="220" height="210" rx="5" fill="#202423" stroke="#444b43" stroke-width="1.7"/><g transform="translate(140 155) scale(1)"><path d="M0 24 V-18" fill="none" stroke="#86a77e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="-12" cy="-5" rx="14" ry="6" transform="rotate(30 -12 -5)" fill="#8bae83"/><ellipse cx="12" cy="-10" rx="14" ry="6" transform="rotate(-32 12 -10)" fill="#a6c398"/><ellipse cx="0" cy="-20" rx="6" ry="12" fill="#76976e"/></g><text x="140" y="220" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#e8e8df" text-anchor="middle">Plant</text><text x="140" y="260" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#aabd9f" text-anchor="middle">Mature crop</text><rect x="365" y="75" width="405" height="76" rx="5" fill="#202423" stroke="#444b43" stroke-width="1.7"/><g transform="translate(410 113) scale(0.56)"><path d="M0 24 V-18" fill="none" stroke="#86a77e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="-12" cy="-5" rx="14" ry="6" transform="rotate(30 -12 -5)" fill="#8bae83"/><ellipse cx="12" cy="-10" rx="14" ry="6" transform="rotate(-32 12 -10)" fill="#a6c398"/><ellipse cx="0" cy="-20" rx="6" ry="12" fill="#76976e"/></g><text x="460" y="100" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#e8e8df" text-anchor="start">Clone</text><text x="460" y="127" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#aabd9f" text-anchor="start">Reserve next cycle</text><path d="M250 190 H302 V113 H355" fill="none" stroke="#a8bc9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M345 113 L362 113" stroke="#a8bc9f" stroke-width="3" fill="none" /><path d="M362 113 l-10 -6 0 12 Z" fill="#a8bc9f"/><rect x="365" y="160" width="405" height="76" rx="5" fill="#202423" stroke="#444b43" stroke-width="1.7"/><g transform="translate(410 198) scale(0.56)"><rect x="-42" y="-25" width="84" height="53" rx="5" fill="#544a3c" stroke="#ab9b7e" stroke-width="1.7"/><rect x="-45" y="-33" width="90" height="14" rx="5" fill="#645943" stroke="#b0a58e" stroke-width="1.7"/><path d="M-34 -13 H34 M-34 0 H34 M-34 13 H34 M0 -20 V25" fill="none" stroke="#82745f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-7" y="-22" width="14" height="11" rx="2" fill="#a49b83" stroke="#c8c0a9" stroke-width="1.7"/></g><text x="460" y="185" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#e8e8df" text-anchor="start">Harvest Box</text><text x="460" y="212" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#aabd9f" text-anchor="start">Collect yield</text><path d="M250 190 H302 V198 H355" fill="none" stroke="#a8bc9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M345 198 L362 198" stroke="#a8bc9f" stroke-width="3" fil