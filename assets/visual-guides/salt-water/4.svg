<svg xmlns="http://www.w3.org/2000/svg" width="800" height="206" viewBox="0 0 800 206" role="img"><title>Coastal desalination — Use fresh output</title><desc>Run the purifier’s fresh-water output to the sprinkler; never connect untreated saltwater to plants.</desc><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#323a34" stroke-width=".7"/></pattern></defs><rect width="800" height="206" fill="#141916"/><rect width="800" height="206" fill="url(#grid)" opacity=".6"/><rect x="0" y="0" width="800" height="58" fill="#222824"/><text x="24" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#a9b8a2" text-anchor="start">FARMING / STEP 04</text><text x="24" y="46" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#f2f2e9" text-anchor="start">Use fresh output</text><text x="776" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#9da99b" text-anchor="end">FIELD MANUAL / L.</text><rect x="25" y="72" width="750" height="110" rx="6" fill="#202423" stroke="#434a43" stroke-width="1.7"/><g transform="translate(105 117) scale(0.72)"><rect x="-46" y="-26" width="42" height="56" rx="8" fill="#343635" stroke="#969b96" stroke-width="1.7"/><rect x="5" y="-17" width="41" height="47" rx="8" fill="#344b5a" stroke="#82abc4" stroke-width="1.7"/><path d="M-28 -26 V-36 H24 V-17" fill="none" stroke="#91a4ad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-25" cy="1" r="8" fill="#18292f" stroke="#7f9ba9" stroke-width="1.6"/><path d="M14 7 Q25 1 37 7 M14 15 Q25 9 37 15" fill="none" stroke="#79b6da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(695 117) scale(0.72)"><path d="M0 -32 V-12 H-24 M0 -12 H24" fill="none" stroke="#a4a9a4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-12" r="7" fill="#729aae" stroke="#a7c4ce" stroke-width="1.6"/><pat