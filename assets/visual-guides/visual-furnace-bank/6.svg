<svg xmlns="http://www.w3.org/2000/svg" width="800" height="352" viewBox="0 0 800 352" role="img"><title>Three automatic electric furnaces — Set the two filters</title><desc>Input: Metal Ore, Sulfur Ore, High Quality Metal Ore. Output: Metal Fragments, Sulfur, High Quality Metal. Select the intended alternative items, not all-required behavior.</desc><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#323a34" stroke-width=".7"/></pattern></defs><rect width="800" height="352" fill="#141916"/><rect width="800" height="352" fill="url(#grid)" opacity=".6"/><rect x="0" y="0" width="800" height="58" fill="#222824"/><text x="24" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#a9b8a2" text-anchor="start">INDUSTRIAL / STEP 06</text><text x="24" y="46" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#f2f2e9" text-anchor="start">Set the two filters</text><text x="776" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#9da99b" text-anchor="end">FIELD MANUAL / L.</text><rect x="25" y="85" width="367" height="208" rx="7" fill="#202423" stroke="#444b43" stroke-width="1.7"/><g transform="translate(208.5 157) scale(0.83)"><rect x="-43" y="-27" width="86" height="54" rx="5" fill="#3c4741" stroke="#91a196" stroke-width="1.7"/><rect x="-30" y="-16" width="60" height="32" rx="3" fill="#18231c" stroke="#819b83" stroke-width="1.7"/><path d="M-20 0 H20 M10 -9 L20 0 L10 9" fill="none" stroke="#95c1a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-36" cy="20" r="3" fill="#d7bc72" stroke="none" stroke-width="1.6"/><circle cx="36" cy="20" r="3" fill="#98bf91" stroke="none" stroke-width="1.6"/></g><text x="208.5" y="220" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#e8e8df" text-anchor="middle">Ore Conveyor</text><text x="208.5" y="266" font-family="Arial, sans-serif" font-size="12" font-we