<svg xmlns="http://www.w3.org/2000/svg" width="800" height="206" viewBox="0 0 800 206" role="img"><title>Conveyor status indicator — Connect the status output</title><desc>Run the conveyor Filter Pass control output to a suitable low-power indicator. Ensure the conveyor input has enough power for the signal and indicator.</desc><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#323a34" stroke-width=".7"/></pattern></defs><rect width="800" height="206" fill="#141916"/><rect width="800" height="206" fill="url(#grid)" opacity=".6"/><rect x="0" y="0" width="800" height="58" fill="#222824"/><text x="24" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#a9b8a2" text-anchor="start">INDUSTRIAL / STEP 02</text><text x="24" y="46" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#f2f2e9" text-anchor="start">Connect the status output</text><text x="776" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#9da99b" text-anchor="end">FIELD MANUAL / L.</text><rect x="25" y="72" width="750" height="110" rx="6" fill="#202423" stroke="#434a43" stroke-width="1.7"/><g transform="translate(105 117) scale(0.72)"><rect x="-43" y="-27" width="86" height="54" rx="5" fill="#3c4741" stroke="#91a196" stroke-width="1.7"/><rect x="-30" y="-16" width="60" height="32" rx="3" fill="#18231c" stroke="#819b83" stroke-width="1.7"/><path d="M-20 0 H20 M10 -9 L20 0 L10 9" fill="none" stroke="#95c1a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-36" cy="20" r="3" fill="#d7bc72" stroke="none" stroke-width="1.6"/><circle cx="36" cy="20" r="3" fill="#98bf91" stroke="none" stroke-width="1.6"/></g><g transform="translate(695 117) scale(0.72)"><path d="M0 -35 V-20 M-30 -3 L-20 -20 H20 L30 -3 Z" fill="#4d5048" stroke="#b6b7a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-25 0 H25" fill="none" stroke="#e4bd74" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-25 8 L-38 30 M0 8 V33 M25 8 L38 30" fill="none" stroke="#b49a62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="210" y="98" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#eeeeea" text-anchor="middle">Conveyor</text><text x="590" y="98" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#eeeeea" text-anchor="middle">Indicator Light</text><text x="210" y="152" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#c6a1e7" text-anchor="middle">Filter Pass</text><text x="590" y="152" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#c6a1e7" text-anchor="middle">Power In</text><circle cx="322" cy="139" r="5" fill="#c6a1e7" stroke="none" stroke-width="1.6"/><circle cx="478" cy="139" r="5" fill="#c6a1e7" stroke="none" stroke-width="1.6"/><path d="M327 139 L473 139" stroke="#c6a1e7" stroke-width="3" fill="none" /><path d="M473 139 l-10 -6 0 12 Z" fill="#c6a1e7"/><text x="400" y="123" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#c6a1e7" text-anchor="middle">SIGNAL</text><text x="42" y="89" font-family="Arial, sans-serif" font-size="10" font-weight="500" fill="#9caaa0" text-anchor="start">01</text></svg>