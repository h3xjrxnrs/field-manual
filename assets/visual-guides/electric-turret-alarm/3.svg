<svg xmlns="http://www.w3.org/2000/svg" width="800" height="206" viewBox="0 0 800 206" role="img"><title>Turret target warning — Use the target signal</title><desc>Connect Has Target to a compatible indicator. If the available signal is insufficient, use a separately powered logic circuit.</desc><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#323a34" stroke-width=".7"/></pattern></defs><rect width="800" height="206" fill="#141916"/><rect width="800" height="206" fill="url(#grid)" opacity=".6"/><rect x="0" y="0" width="800" height="58" fill="#222824"/><text x="24" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#a9b8a2" text-anchor="start">ELECTRICITY / STEP 03</text><text x="24" y="46" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#f2f2e9" text-anchor="start">Use the target signal</text><text x="776" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#9da99b" text-anchor="end">FIELD MANUAL / L.</text><rect x="25" y="72" width="750" height="110" rx="6" fill="#202423" stroke="#434a43" stroke-width="1.7"/><g transform="translate(105 117) scale(0.72)"><path d="M0 10 L-27 34 M0 10 L27 34 M0 10 V34" fill="none" stroke="#a0a498" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="-25" y="-12" width="50" height="25" rx="4" fill="#444b45" stroke="#a1a99c" stroke-width="1.7"/><circle cx="0" cy="0" r="8" fill="#242c29" stroke="#829184" stroke-width="1.6"/><path d="M10 -8 H37 M10 0 H37" fill="none" stroke="#9da39a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(695 117) scale(0.72)"><rect x="-24" y="-31" width="48" height="62" rx="5" fill="#4d403a" stroke="#a39a8f" stroke-width="1.7"/><path d="M-11 -7 H-4 L10 -18 V18 L-4 7 H-11 Z" fill="#805e4c" stroke="#d5ad83" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 -9 Q26 0 17 9 M23 -15