<svg xmlns="http://www.w3.org/2000/svg" width="800" height="352" viewBox="0 0 800 352" role="img"><title>Water storage &amp; gravity — Choose reservoir height</title><desc>Place the reservoir above the sprinkler where practical. Secure the supply and leave access for filling.</desc><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#323a34" stroke-width=".7"/></pattern></defs><rect width="800" height="352" fill="#141916"/><rect width="800" height="352" fill="url(#grid)" opacity=".6"/><rect x="0" y="0" width="800" height="58" fill="#222824"/><text x="24" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#a9b8a2" text-anchor="start">FARMING / STEP 01</text><text x="24" y="46" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#f2f2e9" text-anchor="start">Choose reservoir height</text><text x="776" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#9da99b" text-anchor="end">FIELD MANUAL / L.</text><rect x="60" y="77" width="680" height="255" rx="5" fill="#232923" stroke="#475247" stroke-width="1.7"/><path d="M70 200 H730" fill="none" stroke="#7b8677" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(250 138) scale(0.85)"><rect x="-29" y="-34" width="58" height="68" rx="12" fill="#3e5c6a" stroke="#8eafbe" stroke-width="1.7"/><ellipse cx="0" cy="-28" rx="27" ry="7" fill="#4e7383" stroke="#a5b9c2"/><path d="M-28 -8 H28 M-28 14 H28" fill="none" stroke="#87999e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-16 3 Q0 -4 16 3" fill="none" stroke="#81bbd6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(250 266) scale(0.85)"><path d="M0 -32 V-12 H-24 M0 -12 H24" fill="none" stroke="#a4a9a4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-12" r="7" fill="#729aae" stroke="#a7c4ce" stroke-width="1.6"/><path d="M-24 -6 L-38 17 M-15 -3 L-19 27 M0 -2 V30 M15 -3 L19 27 M24 -6 L38 17" fill="none" stroke="#79b6da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M350 145 L350 260" stroke="#79b6da" stroke-width="3" fill="none" stroke-dasharray="6 6"/><path d="M350 260 l-6 -10 12 0 Z" fill="#79b6da"/><text x="420" y="133" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#e4e8dc" text-anchor="start">Water Barrel</text><text x="420" y="154" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#b7c9ae" text-anchor="start">Upper level</text><text x="420" y="263" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#e4e8dc" text-anchor="start">Sprinkler</text><text x="420" y="284" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#b7c9ae" text-anchor="start">Lower level</text><text x="362" y="193" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#79b6da" text-anchor="start">DOWNHILL</text></svg>