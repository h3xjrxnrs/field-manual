<svg xmlns="http://www.w3.org/2000/svg" width="800" height="352" viewBox="0 0 800 352" role="img"><title>CCTV &amp; Computer Station — Mount the camera</title><desc>Place a deployable powered CCTV camera in a useful position in your own in-game base.</desc><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#323a34" stroke-width=".7"/></pattern></defs><rect width="800" height="352" fill="#141916"/><rect width="800" height="352" fill="url(#grid)" opacity=".6"/><rect x="0" y="0" width="800" height="58" fill="#222824"/><text x="24" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#a9b8a2" text-anchor="start">ELECTRICITY / STEP 01</text><text x="24" y="46" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#f2f2e9" text-anchor="start">Mount the camera</text><text x="776" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#9da99b" text-anchor="end">FIELD MANUAL / L.</text><rect x="25" y="85" width="367" height="208" rx="7" fill="#202423" stroke="#444b43" stroke-width="1.7"/><g transform="translate(208.5 157) scale(0.83)"><rect x="-37" y="-19" width="60" height="36" rx="4" fill="#4d514b" stroke="#a9b1a7" stroke-width="1.7"/><circle cx="23" cy="-1" r="14" fill="#24312f" stroke="#a2b5af" stroke-width="1.6"/><circle cx="23" cy="-1" r="6" fill="#75958e" stroke="none" stroke-width="1.6"/><path d="M-13 17 V30 H20" fill="none" stroke="#a2aaa0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="208.5" y="220" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#e8e8df" text-anchor="middle">CCTV Camera</text><text x="208.5" y="266" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#b3c3ad" text-anchor="middle">Viewing angle</text><rect x="408" y="85" width="367" height="208" rx="7" fill="#202423" stroke="#444b43" stroke-width="1.7"/><g transform="translate(591.5 157) scale(0